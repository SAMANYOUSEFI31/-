<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#e4e4e7"/>
      <stop offset="70%" stop-color="#71717a"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Maskable Full Bleed Background -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>
  
  <!-- Safe Zone Inner Crest (radius scaled to fit 80% safe circle) -->
  <g transform="translate(256, 256) scale(0.85)">
    <circle cx="0" cy="0" r="190" fill="none" stroke="url(#roseGrad)" stroke-width="4" opacity="0.4" stroke-dasharray="12 8"/>
    <circle cx="0" cy="0" r="172" fill="#09090b" stroke="#27272a" stroke-width="4"/>

    <path d="M-130,-130 L130,130 M-140,-140 L-110,-110" stroke="url(#bladeGrad)" stroke-width="8" stroke-linecap="round"/>
    <rect x="-142" y="-142" width="24" height="24" rx="4" fill="url(#goldGrad)" transform="rotate(45, -130, -130)"/>
    <path d="M130,-130 L-130,130 M140,-140 L110,-110" stroke="url(#bladeGrad)" stroke-width="8" stroke-linecap="round"/>
    <rect x="118" y="-142" width="24" height="24" rx="4" fill="url(#goldGrad)" transform="rotate(45, 130, -130)"/>

    <path d="M0,-110 C55,-50 75,-20 75,35 C75,85 40,115 0,115 C-40,115 -75,85 -75,35 C-75,-20 -55,-50 0,-110 Z" fill="url(#roseGrad)" filter="url(#glow)"/>
    <path d="M0,-60 C30,-20 40,0 40,35 C40,65 20,80 0,80 C-20,80 -40,65 -40,35 C-40,0 -30,-20 0,-60 Z" fill="url(#goldGrad)"/>
    <path d="M0,-25 C15,0 20,15 20,35 C20,50 10,60 0,60 C-10,60 -20,50 -20,35 C-20,15 -15,0 0,-25 Z" fill="#ffffff" opacity="0.9"/>
    <path d="M-50,85 Q0,115 50,85 Q0,130 -50,85 Z" fill="url(#goldGrad)" stroke="#18181b" stroke-width="2"/>
  </g>
</svg>
