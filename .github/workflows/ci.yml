name: CI & Migration Integrity

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Test, Build & Disposable Database Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DISPOSABLE_DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/postgres
      TEST_DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/postgres
      DISPOSABLE_DB_ACKNOWLEDGED: 'true'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Unit & Integration Tests
        run: npm test

      - name: Run Build
        run: npm run build

      - name: Verify Prisma Migrations on Disposable PostgreSQL
        run: npm run db:migrations:verify

      # Strategy Note:
      # npm test executes the comprehensive test suite including tests/backup-restore-proof.test.ts (test integration gate).
      # The explicit db:restore:verify command below provides the authentic CLI operational proof.
      # This intentional pairing validates both the test integration and CLI entry point without redundant runs.
      - name: Verify Backup & Restore on Disposable PostgreSQL
        run: npm run db:restore:verify -- --url "$DISPOSABLE_DATABASE_URL" --disposable-acknowledged --e2e
