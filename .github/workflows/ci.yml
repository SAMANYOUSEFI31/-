name: CI & Migration Integrity

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Test, Build & Disposable Database Verification
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DISPOSABLE_DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/postgres
      TEST_DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/postgres
      DISPOSABLE_DB_ACKNOWLEDGED: 'true'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: 20
          cache: 'npm'

      - name: Initialize CI Diagnostics
        run: |
          node scripts/ci-diagnostics.mjs init
          (git diff --name-status HEAD~1 HEAD > ci-diagnostics/changed-files.txt 2>&1 || git status --porcelain > ci-diagnostics/changed-files.txt 2>&1 || true)

      - name: Install Dependencies
        run: node scripts/ci-diagnostics.mjs exec npm-ci.log "npm ci"

      - name: Verify Dependency Vulnerabilities
        run: node scripts/ci-diagnostics.mjs exec audit.log "npm audit --audit-level=high"

      - name: Run Linter
        run: node scripts/ci-diagnostics.mjs exec lint.log "npm run lint"

      - name: Run Unit & Integration Tests
        run: node scripts/ci-diagnostics.mjs exec test-full.log "npm test"

      - name: Run Build
        run: node scripts/ci-diagnostics.mjs exec build.log "npm run build"

      - name: Verify Prisma Migrations on Disposable PostgreSQL
        run: node scripts/ci-diagnostics.mjs exec migration.log "npm run db:migrations:verify"

      # Strategy Note:
      # npm test executes the comprehensive test suite including tests/backup-restore-proof.test.ts (test integration gate).
      # The explicit db:restore:verify command below provides the authentic CLI operational proof.
      # This intentional pairing validates both the test integration and CLI entry point without redundant runs.
      - name: Verify Backup & Restore on Disposable PostgreSQL
        run: node scripts/ci-diagnostics.mjs exec restore.log "npm run db:restore:verify -- --url \"$DISPOSABLE_DATABASE_URL\" --disposable-acknowledged --e2e"

      - name: Finalize CI Diagnostics
        if: always()
        run: node scripts/ci-diagnostics.mjs finalize

      - name: Upload Diagnostic Artifacts
        if: always()
        uses: actions/upload-artifact@5d5d22a31266ced268874388b861e4b58bb5c2f3 # v4.3.1
        with:
          name: ci-diagnostics
          path: ci-diagnostics
          retention-days: 14
          if-no-files-found: warn

  dependency-review:
    name: Dependency Review Gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Dependency Review
        uses: actions/dependency-review-action@3b139cfc5fae8b618d3eae3675e383bb1769c019 # v4.5.0
        with:
          fail-on-severity: high
