<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>بوشیدو - سامانه انضباط فردی و تسلط ۹۰ روزه</title>
    
    <!-- غیرفعال کردن تغییر رنگ اجباری سامسونگ و پشتیبانی دارک‌مود -->
    <meta name="color-scheme" content="dark" />
    <meta name="supported-color-schemes" content="dark" />
    <meta name="darkreader-lock" content="true" />

    <!-- تنظیمات رنگ نوار بالای سیستم‌عامل در آیفون و اندروید -->
    <meta name="theme-color" content="#09090b" />
    <meta name="background-color" content="#09090b" />

    <!-- تنظیمات PWA نیتیو (حذف status-bar-style برای حذف لایه تاری اجباری iOS) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="بوشیدو" />
    <meta name="application-name" content="بوشیدو - سامانه انضباط شخصی" />
    <meta name="msapplication-TileColor" content="#09090b" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="سامانه ارزیابی و استمرار انضباط فردی و تسلط ۹۰ روزه سامورایی بوشیدو" />

    <!-- آیکون‌ها و مانیفست PWA -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- فونت‌ها با پالیسی fallback برای جلوگیری از پرش متن و حفظ دسترسی آفلاین -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Vazirmatn:wght@300;400;500;600;700;800;900&display=fallback" rel="stylesheet">
  </head>
  <body class="bg-[#09090b] text-zinc-100 selection:bg-[#E11D48] selection:text-white font-sans antialiased overflow-x-hidden">
    <div id="root">
      <style>
        @keyframes bushidoPulse {
          0%, 100% { transform: scale(1); opacity: 1; filter: drop-shadow(0 0 16px rgba(225, 29, 72, 0.45)); }
          50% { transform: scale(0.96); opacity: 0.85; filter: drop-shadow(0 0 8px rgba(225, 29, 72, 0.25)); }
        }
        @keyframes bushidoFadeIn {
          from { opacity: 0; }
          to { opacity: 1; }
        }
      </style>
      <div style="min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #09090b; color: #f4f4f5; text-align: center; padding: 1.5rem; user-select: none; font-family: 'Vazirmatn', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Segoe UI Arabic', Roboto, 'Tahoma', 'Arial', sans-serif; animation: bushidoFadeIn 0.3s ease-out;">
        <div style="width: 58px; height: 58px; border-radius: 18px; background-color: #E11D48; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 900; color: #ffffff; margin-bottom: 1.25rem; animation: bushidoPulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;">
          武
        </div>
        <div style="font-size: 16px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 0.35rem; color: #f4f4f5;">بوشیدو</div>
        <div style="font-size: 10px; color: #71717a; font-family: 'JetBrains Mono', ui-monospace, monospace; letter-spacing: 0.12em;">BUSHIDO DISCIPLINE OS</div>
        <div id="bushido-slow-loader" style="display: none; margin-top: 1.5rem; flex-direction: column; align-items: center; gap: 0.5rem;">
          <p style="font-size: 11px; color: #a1a1aa; margin: 0;">بارگذاری بیش از حد معمول طول کشید</p>
          <button id="bushido-force-reload" style="padding: 0.4rem 0.8rem; background: #27272a; border: 1px solid #3f3f46; color: #f4f4f5; border-radius: 8px; font-size: 11px; cursor: pointer; font-family: inherit;">
            پاک‌سازی کَش و بارگذاری مجدد
          </button>
        </div>
      </div>
    </div>
    <script>
      (function() {
        var slowTimer = setTimeout(function() {
          var el = document.getElementById('bushido-slow-loader');
          if (el) el.style.display = 'flex';
        }, 5000);

        function hardReset() {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              regs.forEach(function(r) { r.unregister(); });
            });
          }
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              keys.forEach(function(k) { caches.delete(k); });
            });
          }
          setTimeout(function() {
            window.location.reload();
          }, 200);
        }

        document.addEventListener('click', function(e) {
          if (e.target && e.target.id === 'bushido-force-reload') {
            hardReset();
          }
        });

        // Catch stale chunk errors or syntax errors from HTML MIME-type mismatch
        window.addEventListener('error', function(e) {
          var msg = (e && e.message) ? e.message.toLowerCase() : '';
          var isChunkOrSyntax = msg.indexOf('dynamically imported module') !== -1 ||
                                msg.indexOf('unexpected token') !== -1 ||
                                msg.indexOf('loading chunk') !== -1;
          if (isChunkOrSyntax && !sessionStorage.getItem('bushido_auto_recovered')) {
            sessionStorage.setItem('bushido_auto_recovered', 'true');
            hardReset();
          }
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
